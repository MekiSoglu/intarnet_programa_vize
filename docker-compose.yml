# =============================================================
#  Docker Compose: PostgreSQL + GlassFish 7
#
#  Kullanim:
#    1) mvn clean package           -> target/muhasebe-backend.war uretir
#    2) docker compose up -d        -> PostgreSQL ve GlassFish baslar
#    3) Tarayici: http://localhost:8080/muhasebe-backend/
#       Admin console: http://localhost:4848  (admin / no password)
#
#  Durdurmak:           docker compose down
#  Volume temizlemek:   docker compose down -v
# =============================================================

services:

  # =============================================================
  #  PostgreSQL 16
  # =============================================================
  postgres:
    image: postgres:16-alpine
    container_name: muhasebe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: muhasebedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d muhasebedb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - muhasebe-net

  # =============================================================
  #  GlassFish 7 - Jakarta EE 10
  # =============================================================
  glassfish:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muhasebe-glassfish
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"   # Uygulama
      - "4848:4848"   # GlassFish admin console
    networks:
      - muhasebe-net

volumes:
  postgres_data:
    name: muhasebe-postgres-data

networks:
  muhasebe-net:
    name: muhasebe-network